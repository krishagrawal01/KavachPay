    <script>
      // Dynamically generate valid PNG icons via canvas as a guaranteed fallback
      // if the static files in /public ever fail to serve
      (function () {
        function generateIconPng(size) {
          var canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          var ctx = canvas.getContext('2d');
          // Obsidian background
          ctx.fillStyle = '#08090C';
          ctx.fillRect(0, 0, size, size);
          // Rounded rect background
          var m = size * 0.1;
          var r = size * 0.22;
          var w = size - 2 * m;
          var h = size - 2 * m;
          ctx.fillStyle = '#111318';
          ctx.beginPath();
          ctx.moveTo(m + r, m);
          ctx.arcTo(m + w, m, m + w, m + h, r);
          ctx.arcTo(m + w, m + h, m, m + h, r);
          ctx.arcTo(m, m + h, m, m, r);
          ctx.arcTo(m, m, m + w, m, r);
          ctx.closePath();
          ctx.fill();
          // Green shield
          ctx.fillStyle = '#00E599';
          var sx = size * 0.5;
          var sy = size * 0.46;
          var sw = size * 0.2;
          var sh = size * 0.28;
          ctx.beginPath();
          ctx.moveTo(sx, sy - sh * 0.5);
          ctx.quadraticCurveTo(sx + sw, sy - sh * 0.5, sx + sw, sy - sh * 0.2);
          ctx.lineTo(sx + sw, sy + sh * 0.15);
          ctx.quadraticCurveTo(sx + sw * 0.5, sy + sh * 0.5, sx, sy + sh * 0.5);
          ctx.quadraticCurveTo(sx - sw * 0.5, sy + sh * 0.5, sx - sw, sy + sh * 0.15);
          ctx.lineTo(sx - sw, sy - sh * 0.2);
          ctx.quadraticCurveTo(sx - sw, sy - sh * 0.5, sx, sy - sh * 0.5);
          ctx.closePath();
          ctx.fill();
          var dataUrl = canvas.toDataURL('image/png');
          return dataUrl;
        }
        // Store in global scope so the app can use them if needed
        window.__kavachIcons = {
          192: generateIconPng(192),
          512: generateIconPng(512),
        };
      })();
    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
